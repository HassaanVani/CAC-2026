[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"

[[headers]]
  for = "/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/wasm/vision_wasm_internal.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/wasm/vision_wasm_nosimd_internal.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/models/hand_landmarker.task"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=0, must-revalidate"
